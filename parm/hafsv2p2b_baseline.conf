[config]
RUN=hfsb
run_wave=no

[prelaunch]
basin_overrides=no

[grid]
istart_nest=113,-999
jstart_nest=113,-999
iend_nest=912,-999
jend_nest=912,-999
idim_nest=1200,600
jdim_nest=1200,600
delx_nest=0.03,0.01
dely_nest=0.03,0.01

[grid_mvnest1res]
istart_nest_mvnest1res=113
jstart_nest_mvnest1res=113
iend_nest_mvnest1res=912
jend_nest_mvnest1res=912
idim_nest_mvnest1res=3600
jdim_nest_mvnest1res=3600
delx_nest_mvnest1res=0.01
dely_nest_mvnest1res=0.01

[atm_init]
# ccpp suites
ccpp_suite_regional_init=FV3_HAFS_v2
ccpp_suite_glob_init=FV3_HAFS_v2
ccpp_suite_nest_init=FV3_HAFS_v2

[vi]
vi_warm_start_vmax_threshold=20
vi_pert_smth=1
vi_cloud=2

[gsi]
s_ens_h=300,75,90
tdr_superob=.true.

[forecast]
# ccpp suites
ccpp_suite_regional=FV3_HAFS_v2_coupled
ccpp_suite_glob=FV3_HAFS_v2_coupled
ccpp_suite_nest=FV3_HAFS_v2_coupled

all_tasks=1080
atm_tasks=1020
ocn_tasks=60

layoutx=30,20
layouty=20,18
npx=1201,601
npy=1201,601

dt_atmos=72
k_split=2,4
n_split=4,8
dt_inner=36
ntrack=0,5

fhswr=720.
fhlwr=720.
# RRTMGP
do_rrtmgp=.true.

lim_fac=2.8,2.8
rlmx=300.,75.
elmx=300.,75.
sfc_rlm=0,0
tc_pbl=1,1

sa3dtke_dyco=.false.
sa3dtke=.false.
tte_edmf=.false.

clam_deep=0.18
c1_deep=0.002
c1_shal=0.0005

# NoahMP LSM related options
lsm=2
ialb=2
iems=2

use_oceanuv=.false.

write_groups=3
write_tasks_per_group=20
