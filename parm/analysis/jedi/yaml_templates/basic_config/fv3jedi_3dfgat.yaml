_filenames3: &fv3file_names3
  filename_core: '_FV3_CORE_FILE3_'
  filename_trcr: '_FV3_TRCR_FILE3_'
  filename_sfcd: '_FV3_SFCD_FILE3_'
  filename_sfcw: '_FV3_SFCW_FILE3_'
  filename_cplr: '_FV3_CPLR_FILE3_'

_geometry: &geometry_configs
  namelist filename: _INPUT_HAFS_NML_
  field metadata override: fieldmeta.yaml
  akbk: bkg/_FV3_AKBK_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  fieldsets:
    fieldset: dynamics_hafs.yaml
  vert coordinate: logp

_ens_filenames: &ens_fv3file_names
  filename_core: '_FV3_CORE_ENS_FILE_'
  filename_trcr: '_FV3_TRCR_ENS_FILE_'
  filename_sfcd: '_FV3_SFCD_ENS_FILE_'
  filename_sfcw: '_FV3_SFCW_ENS_FILE_'
  filename_cplr: '_FV3_CPLR_ENS_FILE_'

_ens_geometry: &ens_geometry_configs
  namelist filename: _INPUT_HAFS_ENS_NML_
  field metadata override: fieldmeta.yaml
  akbk: bkg/_FV3_AKBK_ENS_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  fieldsets:
    fieldset: dynamics_hafs.yaml
  vert coordinate: logp

cost function:
  cost type: 3D-FGAT
  time window:
    begin: _INITIALDATE_
    length: PT6H
  tolerance AD resolution change: 1.0e-13
  geometry:
    <<: *geometry_configs
  other geometry:
    <<: *ens_geometry_configs
  analysis variables: &3dvars [eastward_wind,northward_wind,air_temperature,air_pressure_thickness,water_vapor_mixing_ratio_wrt_moist_air,ozone_mass_mixing_ratio]
  model:
    name: PSEUDO
    tstep: PT3H
    filetype: fms restart
    filename is datetime templated: true
    datapath: bkg/
    filename_core: '%yyyy%mm%dd.%hh%MM%ss.fv_core.res_NEST_TILE_STR_.nc'
    filename_trcr: '%yyyy%mm%dd.%hh%MM%ss.fv_tracer.res_NEST_TILE_STR_.nc'
    filename_sfcd: '%yyyy%mm%dd.%hh%MM%ss.sfc_data_NEST_TILE_STR_.nc'
    filename_sfcw: '%yyyy%mm%dd.%hh%MM%ss.fv_srf_wnd.res_NEST_TILE_STR_.nc'
    filename_cplr: '%yyyy%mm%dd.%hh%MM%ss.coupler_NEST_TILE_STR_.res'
  background:
    read_from_file: 1
    datetime: _INITIALDATE_
    filetype: fms restart
    filename is datetime templated: true
    datapath: bkg/
    <<: *fv3file_names3
    state variables: &3dvars_state [eastward_wind,northward_wind,upward_air_velocity,air_temperature,air_pressure_thickness,water_vapor_mixing_ratio_wrt_moist_air,layer_thickness,cloud_liquid_ice,cloud_liquid_water,snow_water,rain_water,graupel,cloud_ice_number_concentration,rain_number_concentration,ozone_mass_mixing_ratio,phis,slmsk,sheleg,skin_temperature_at_surface,vtype,stype,vfrac,stc,smc,snwdph,u_srf,v_srf,f10m]
  background error:
    covariance model: ensemble
    members from template:
      template:
        datetime: _ANALYSISDATE_
        filetype: fms restart
        state variables: *3dvars_state
        datapath: ensemble_data/mem%mem%/
        <<: *ens_fv3file_names
      pattern: '%mem%'
      nmembers: _ENS_SIZE_
      zero padding: 3
    localization:
      localization method: SABER
      saber central block:
        saber block name: BUMP_NICAS
        active variables: *3dvars
        read:
          io:
            data directory: bump
            files prefix: fv3jedi_bumpparameters_nicas_hafs_atm
            alias:
            - in code: common
              in file: common_250km
          drivers:
             multivariate strategy: duplicated
             read local nicas: true

#------------------------------------------------------------------------------
  observations:
    observers:
@OBSERVATIONS@

###############################################

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 50
    gradient norm reduction: 1e-60
    test: on
    geometry:
      <<: *ens_geometry_configs
    diagnostics:
      departures: ombg
final:
  diagnostics:
    departures: oman

output:
  filetype: fms restart
  datapath: ./
  prefix: analysis
  frequency: PT3H

