input geometry:
  namelist filename: _INPUT_HAFS_NML_
  akbk: bkg/_FV3_AKBK_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  vert coordinate: logp
output geometry:
  namelist filename: _INPUT_HAFS_NML_
  akbk: bkg/_FV3_AKBK_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  vert coordinate: logp
states:
- input:
    datetime: _INTERP_DATE_
    filetype: structured grid
    gridtype: gaussian
    akbk: bkg/_FV3_AKBK_FILE_
    mode: read
    lon_min: _MIN_LON_
    lon_max: _MAX_LON_
    lat_min: _MIN_LAT_
    lat_max: _MAX_LAT_
    input filename: _INPUT_FILE_
    state variables: &state_variables_B
    - eastward_wind
    - northward_wind
    - upward_air_velocity
    - air_temperature
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - rain_water
    - snow_water
    - graupel
    - cloud_ice_number_concentration
    - rain_number_concentration
    - ozone_mass_mixing_ratio
    - air_pressure_thickness
    - layer_thickness
    field io names: &id001_new
      eastward_wind: ugrd
      northward_wind: vgrd
      upward_air_velocity: dzdt
      air_temperature: tmp
      air_pressure_at_surface: pressfc
      water_vapor_mixing_ratio_wrt_moist_air: spfh
      cloud_liquid_ice: icmr
      cloud_liquid_water: clwmr
      snow_water: snmr
      rain_water: rwmr
      graupel: grle
      cloud_ice_number_concentration: nccice
      rain_number_concentration: nconrd
      ozone_mass_mixing_ratio: o3mr
      geopotential_height_at_surface: hgtsfc
      air_pressure_thickness: dpres
      layer_thickness: delz
  output:
    filetype: fms restart
    datetime: _INTERP_DATE_
    datapath: _OUTPUT_DIR_/
    filename_core: fv_core.res.nest02.tile2.nc
    filename_trcr: fv_tracer.res.nest02.tile2.nc
    filename_sfcd: sfc_data.nest02.tile2.nc
    filename_sfcw: fv_srf_wnd.res.nest02.tile2.nc
    filename_cplr: coupler.res
    field io names:
      eastward_wind: ua
      northward_wind: va
      upward_air_velocity: W
      air_temperature: T
      air_pressure_thickness: delp
      layer_thickness: DZ
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_water: liq_wat
      cloud_liquid_ice: ice_wat
      snow_water: snowwat
      rain_water: rainwat
      graupel: graupel
      cloud_ice_number_concentration: ice_nc
      rain_number_concentration: rain_nc
      ozone_mass_mixing_ratio: o3mr
      skin_temperature_at_surface: tsea
      air_pressure_at_surface: ps
      geopotential_at_surface: phis
      soilMoistureVolumetric: smc
      totalSnowDepth: snwdph
      eastward_wind_at_surface: u_srf
      northward_wind_at_surface: v_srf
