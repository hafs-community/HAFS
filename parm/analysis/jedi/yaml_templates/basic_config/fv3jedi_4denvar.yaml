_filenames: &fv3file_names
  filename_core: '_FV3_CORE_FILE_'
  filename_trcr: '_FV3_TRCR_FILE_'
  filename_sfcd: '_FV3_SFCD_FILE_'
  filename_sfcw: '_FV3_SFCW_FILE_'
  filename_cplr: '_FV3_CPLR_FILE_'

_filenames3: &fv3file_names3
  filename_core: '_FV3_CORE_FILE3_'
  filename_trcr: '_FV3_TRCR_FILE3_'
  filename_sfcd: '_FV3_SFCD_FILE3_'
  filename_sfcw: '_FV3_SFCW_FILE3_'
  filename_cplr: '_FV3_CPLR_FILE3_'

_filenames9: &fv3file_names9
  filename_core: '_FV3_CORE_FILE9_'
  filename_trcr: '_FV3_TRCR_FILE9_'
  filename_sfcd: '_FV3_SFCD_FILE9_'
  filename_sfcw: '_FV3_SFCW_FILE9_'
  filename_cplr: '_FV3_CPLR_FILE9_'

_geometry: &geometry_configs
  namelist filename: _INPUT_HAFS_NML_
  akbk: bkg/_FV3_AKBK_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  vert coordinate: logp

_ens_filenames: &ens_fv3file_names
  filename_core: '_FV3_CORE_ENS_FILE_'
  filename_trcr: '_FV3_TRCR_ENS_FILE_'
  filename_sfcd: '_FV3_SFCD_ENS_FILE_'
  filename_sfcw: '_FV3_SFCW_ENS_FILE_'
  filename_cplr: '_FV3_CPLR_ENS_FILE_'

_ens_filenames3: &ens_fv3file_names3
  filename_core: '_FV3_CORE_ENS_FILE3_'
  filename_trcr: '_FV3_TRCR_ENS_FILE3_'
  filename_sfcd: '_FV3_SFCD_ENS_FILE3_'
  filename_sfcw: '_FV3_SFCW_ENS_FILE3_'
  filename_cplr: '_FV3_CPLR_ENS_FILE3_'

_ens_filenames9: &ens_fv3file_names9
  filename_core: '_FV3_CORE_ENS_FILE9_'
  filename_trcr: '_FV3_TRCR_ENS_FILE9_'
  filename_sfcd: '_FV3_SFCD_ENS_FILE9_'
  filename_sfcw: '_FV3_SFCW_ENS_FILE9_'
  filename_cplr: '_FV3_CPLR_ENS_FILE9_'

_ens_geometry: &ens_geometry_configs
  namelist filename: _INPUT_HAFS_ENS_NML_
  akbk: bkg/_FV3_AKBK_ENS_FILE_
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  vert coordinate: logp

cost function:
  cost type: 4D-Ens-Var
  time window:
    begin: _INITIALDATE_
    length: PT6H
  subwindow: PT3H
  parallel subwindows: false
  tolerance AD resolution change: 1.0e-13
  geometry:
    <<: *geometry_configs
  other geometry:
    <<: *ens_geometry_configs
  analysis variables: &vars_analysis
  - eastward_wind
  - northward_wind
  - upward_air_velocity
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  background:
    states:
    - datetime: _INITIALDATE_
      filetype: fms restart
      datapath: bkg/
      <<: *fv3file_names3
      state variables: &vars_state
      - eastward_wind
      - northward_wind
      - upward_air_velocity
      - air_temperature
      - air_pressure_thickness
      - air_pressure_at_surface
      - layer_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - graupel
      - cloud_ice_number_concentration
      - rain_number_concentration
      - ozone_mass_mixing_ratio
      - geopotential_height_times_gravity_at_surface
      - slmsk
      - sheleg
      - skin_temperature_at_surface
      - vtype
      - stype
      - vfrac
      - stc
      - soilMoistureVolumetric
      - totalSnowDepth
      - eastward_wind_at_surface
      - northward_wind_at_surface
      - f10m
      field io names: &field_io_names
        eastward_wind: ua
        northward_wind: va
        upward_air_velocity: W
        air_temperature: T
        air_pressure_thickness: delp
        layer_thickness: DZ
        water_vapor_mixing_ratio_wrt_moist_air: sphum
        cloud_liquid_water: liq_wat
        cloud_liquid_ice: ice_wat
        snow_water: snowwat
        rain_water: rainwat
        graupel: graupel
        cloud_ice_number_concentration: ice_nc
        rain_number_concentration: rain_nc
        ozone_mass_mixing_ratio: o3mr
        skin_temperature_at_surface: tsea
        air_pressure_at_surface: ps
        geopotential_height_times_gravity_at_surface: phis
        soilMoistureVolumetric: smc
        totalSnowDepth: snwdph
        eastward_wind_at_surface: u_srf
        northward_wind_at_surface: v_srf
    - datetime: _ANALYSISDATE_
      filetype: fms restart
      datapath: bkg/
      <<: *fv3file_names
      state variables: *vars_state
      field io names: *field_io_names
    - datetime: _ENDDATE_
      filetype: fms restart
      datapath: bkg/
      <<: *fv3file_names9
      state variables: *vars_state
      field io names: *field_io_names

  background error:
    covariance model: ensemble
    members from template:
      template:
        states:
        - datetime: _INITIALDATE_
          filetype: fms restart
          state variables: *vars_state
          field io names: *field_io_names
          datapath: ensemble_data/mem%mem%/
          <<: *ens_fv3file_names3
        - datetime: _ANALYSISDATE_
          filetype: fms restart
          state variables: *vars_state
          field io names: *field_io_names
          datapath: ensemble_data/mem%mem%/
          <<: *ens_fv3file_names
        - datetime: _ENDDATE_
          filetype: fms restart
          state variables: *vars_state
          field io names: *field_io_names
          datapath: ensemble_data/mem%mem%/
          <<: *ens_fv3file_names9
      pattern: '%mem%'
      nmembers: _ENS_SIZE_
      zero padding: 3
    localization:
      localization method: SABER
      saber central block:
        saber block name: BUMP_NICAS
        active variables: *vars_analysis
        read:
          io:
            data directory: bump
            files prefix: fv3jedi_bumpparameters_nicas_hafs_atm
            alias:
            - in code: common
              in file: common_250km
          drivers:
             multivariate strategy: duplicated
             read local nicas: true

#------------------------------------------------------------------------------
  observations:
    observers:
@OBSERVATIONS@

###############################################

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 50
    gradient norm reduction: 1e-60
    test: on
    geometry:
      <<: *ens_geometry_configs
    diagnostics:
      departures: ombg1
  - ninner: 50
    gradient norm reduction: 1e-60
    test: on
    geometry:
      <<: *ens_geometry_configs
    diagnostics:
      departures: ombg2
final:
  diagnostics:
    departures: oman

output:
  filetype: fms restart
  datapath: ./
  first: PT0S
  date: _INITIALDATE_
  frequency: PT3H
  field io names:
    eastward_wind: ua
    northward_wind: va
    upward_air_velocity: W
    air_temperature: T
    air_pressure_thickness: delp
    layer_thickness: DZ
    water_vapor_mixing_ratio_wrt_moist_air: sphum
    cloud_liquid_water: liq_wat
    cloud_liquid_ice: ice_wat
    snow_water: snowwat
    rain_water: rainwat
    graupel: graupel
    cloud_ice_number_concentration: ice_nc
    rain_number_concentration: rain_nc
    ozone_mass_mixing_ratio: o3mr
    skin_temperature_at_surface: tsea
    air_pressure_at_surface: ps
    geopotential_height_times_gravity_at_surface: phis
    soilMoistureVolumetric: smc
    totalSnowDepth: snwdph
    eastward_wind_at_surface: u_srf
    northward_wind_at_surface: v_srf
