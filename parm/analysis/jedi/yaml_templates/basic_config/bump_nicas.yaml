_filenames: &fv3file_names
  filename_core: '_FV3_CORE_ENS_FILE_'
  filename_trcr: '_FV3_TRCR_ENS_FILE_'
  filename_sfcd: '_FV3_SFCD_ENS_FILE_'
  filename_sfcw: '_FV3_SFCW_ENS_FILE_'
  filename_cplr: '_FV3_CPLR_ENS_FILE_'

geometry:
  namelist filename: _INPUT_HAFS_ENS_NML_
  field metadata override: fieldmeta.yaml
  akbk: bkg/_FV3_AKBK_ENS_FILE_
  vert coordinate: "sigma"
  io_layout: [1,1]
  ntiles: 1
  fms initialization:
    namelist filename: fmsmpp.nml
    field table filename: field_table
  fieldsets:
    fieldset: dynamics_hafs.yaml

background:
  read_from_file: 1
  datetime: _ANALYSISDATE_
  filetype: fms restart
  datapath: bkg
  <<: *fv3file_names
  state variables: &3dvars [eastward_wind,northward_wind,air_temperature,air_pressure_thickness,water_vapor_mixing_ratio_wrt_moist_air,ozone_mass_mixing_ratio]

background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      general:
        universe length-scale: _LOC_H_.0e3
      io:
        files prefix: bump/fv3jedi_bumpparameters_nicas_hafs_atm
        alias:
        - in code: air_temperature
          in file: common_250km
      drivers:
        multivariate strategy: univariate 
        compute nicas: true
        write local nicas: true
      nicas:
        resolution: 8
        explicit length-scales: true
        max horizontal grid size: 120000
        horizontal length-scale:
        - groups: *3dvars
          value: _LOC_H_000.0
        vertical length-scale:
        - groups: *3dvars
          profile: [0.0029418 , 0.00647197, 0.01135698, 0.01784443, 0.02493904, 0.03263378
                , 0.04092158, 0.04979547, 0.05924817, 0.06927289, 0.07986232, 0.09100957
                , 0.10270751, 0.11494924, 0.12772035, 0.14100862, 0.15480879, 0.16911522
                , 0.18392204, 0.19922304, 0.21501179, 0.23128206, 0.24802706, 0.26524019
                , 0.28291477, 0.30104408, 0.31962122, 0.33863938, 0.35809171, 0.37797119
                , 0.39827122, 0.41898451, 0.44010435, 0.4616238 , 0.48353572, 0.50583329
                , 0.52850971, 0.55155767, 0.57497026, 0.59874063, 0.62286156, 0.64728673
                , 0.67191529, 0.6966416 , 0.72135994, 0.74596366, 0.7703476 , 0.79440576
                , 0.8180317 , 0.8411286 , 0.86360956, 0.88539665, 0.90642596, 0.92664454
                , 0.94601083, 0.96449406, 0.9820758 , 0.9987454 , 1.01450381, 1.02935856
                , 1.04332466, 1.05642309, 1.06867898, 1.08012322, 1.09078597, 1.10070587
                , 1.10991818, 1.11845897, 1.12636751, 1.13367965, 1.14043589, 1.14666826
                , 1.15241347, 1.15770585, 1.162578  , 1.16705857, 1.17117818, 1.17496266
                , 1.17843961, 1.18163135, 1.18456504]
      grids:
      - model:
          variables:
          - air_temperature
      output model files:
      - parameter: cor_rh
        file:
          filetype: fms restart
          datapath: bump/
          filename_core: bumpparameters_nicas_hafs_atm.cor_rh.fv_core.res.nc
          filename_trcr: bumpparameters_nicas_hafs_atm.cor_rh.fv_tracer.res.nc
          filename_sfcd: bumpparameters_nicas_hafs_atm.cor_rh.sfc_data.nc
          filename_sfcw: bumpparameters_nicas_hafs_atm.cor_rh.fv_srf_wnd.res.nc
          filename_cplr: bumpparameters_nicas_hafs_atm.cor_rh.coupler.res
      - parameter: cor_rv
        file:
          filetype: fms restart
          datapath: bump/
          filename_core: bumpparameters_nicas_hafs_atm.cor_rv.fv_core.res.nc
          filename_trcr: bumpparameters_nicas_hafs_atm.cor_rv.fv_tracer.res.nc
          filename_sfcd: bumpparameters_nicas_hafs_atm.cor_rv.sfc_data.nc
          filename_sfcw: bumpparameters_nicas_hafs_atm.cor_rv.fv_srf_wnd.res.nc
          filename_cplr: bumpparameters_nicas_hafs_atm.cor_rv.coupler.res
