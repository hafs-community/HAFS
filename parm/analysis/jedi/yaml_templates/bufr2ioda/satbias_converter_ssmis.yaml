input coeff file: gdas.#HH#.abias
input err file: gdas.#HH#.abias_pc
default predictors: &default_preds
- constant
- sensorZenithAngle
- cloudWaterContent
- lapseRate_order_2
- lapseRate
- cosineOfLatitudeTimesOrbitNode
- sineOfLatitude
- emissivityJacobian
- sensorScanAngle_order_4
- sensorScanAngle_order_3
- sensorScanAngle_order_2
- sensorScanAngle

output:
- sensor: ssmis_f17
  output file: output/satbias_radiance_ssmis_f17_#HH#.nc
  predictors: *default_preds

- sensor: ssmis_f18
  output file: output/satbias_radiance_ssmis_f18_#HH#.nc
  predictors: *default_preds

- sensor: ssmis_f19
  output file: output/satbias_radiance_ssmis_f19_#HH#.nc
  predictors: *default_preds
