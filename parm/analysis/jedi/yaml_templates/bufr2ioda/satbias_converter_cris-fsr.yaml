input coeff file: gdas.#HH#.abias
input err file: gdas.#HH#.abias_pc
default predictors: &default_preds
- constant
- sensorZenithAngle
- cloudWaterContent
- lapseRate_order_2
- lapseRate
- cosineOfLatitudeTimesOrbitNode
- sineOfLatitude
- emissivityJacobian
- sensorScanAngle_order_4
- sensorScanAngle_order_3
- sensorScanAngle_order_2
- sensorScanAngle

output:
- sensor: cris-fsr_npp
  output file: output/satbias_radiance_cris-fsr_npp_#HH#.nc
  predictors: *default_preds
- sensor: cris-fsr_n20
  output file: output/satbias_radiance_cris-fsr_n20_#HH#.nc
  predictors: *default_preds
- sensor: cris-fsr_n21
  output file: output/satbias_radiance_cris-fsr_n21_#HH#.nc
  predictors: *default_preds
