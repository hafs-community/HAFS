input coeff file: gdas.#HH#.abias
input err file: gdas.#HH#.abias_pc
default predictors: &default_preds
- constant
- sensorZenithAngle
- cloudWaterContent
- lapseRate_order_2
- lapseRate
- cosineOfLatitudeTimesOrbitNode
- sineOfLatitude
- emissivityJacobian
- sensorScanAngle_order_4
- sensorScanAngle_order_3
- sensorScanAngle_order_2
- sensorScanAngle

output:
- sensor: amsua_metop-a
  output file: output/satbias_radiance_amsua_metop-a_#HH#.nc
  predictors: *default_preds

- sensor: amsua_metop-b
  output file: output/satbias_radiance_amsua_metop-b_#HH#.nc
  predictors: *default_preds

- sensor: amsua_n18
  output file: output/satbias_radiance_amsua_n18_#HH#.nc
  predictors: *default_preds

- sensor: amsua_n19
  output file: output/satbias_radiance_amsua_n19_#HH#.nc
  predictors: *default_preds
