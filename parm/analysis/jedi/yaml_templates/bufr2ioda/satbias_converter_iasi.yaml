input coeff file: gdas.#HH#.abias
input err file: gdas.#HH#.abias_pc
default predictors: &default_preds
- constant
- sensorZenithAngle
- cloudWaterContent
- lapseRate_order_2
- lapseRate
- cosineOfLatitudeTimesOrbitNode
- sineOfLatitude
- emissivityJacobian
- sensorScanAngle_order_4
- sensorScanAngle_order_3
- sensorScanAngle_order_2
- sensorScanAngle

output:
- sensor: iasi_metop-b
  output file: output/satbias_radiance_iasi_metop-b_#HH#.nc
  predictors: *default_preds

- sensor: iasi_metop-c
  output file: output/satbias_radiance_iasi_metop-c_#HH#.nc
  predictors: *default_preds
