input coeff file: gdas.#HH#.abias
input err file: gdas.#HH#.abias_pc
default predictors: &default_preds
- constant
- sensorZenithAngle
- cloudWaterContent
- lapseRate_order_2
- lapseRate
- cosineOfLatitudeTimesOrbitNode
- sineOfLatitude
- emissivityJacobian
- sensorScanAngle_order_4
- sensorScanAngle_order_3
- sensorScanAngle_order_2
- sensorScanAngle

output:
- sensor: mhs_n18
  output file: output/satbias_radiance_mhs_n18_#HH#.nc
  predictors: *default_preds

- sensor: mhs_n19
  output file: output/satbias_radiance_mhs_n19_#HH#.nc
  predictors: *default_preds

- sensor: mhs_metop-b
  output file: output/satbias_radiance_mhs_metop-b_#HH#.nc
  predictors: *default_preds
