bufr:
  subsets:
    - ASCATW

  variables:
    # MetaData
    prepbufrDataLevelCategory:
      query: "*/CAT"
    timestamp:
      timeoffset:
        timeOffset: "*/DHR"
        transforms:
          - scale: 3600
        referenceTime: #ANADATE#

    obsTimeMinusCycleTime:
      query: "*/DHR"

    longitude:
      query: "*/XOB"
      transforms:
        - wrap: [ -180.0, 180.0 ]

    latitude:
      query: "*/YOB"

    stationIdentification:
      query: "*/SID"

    height:
      query: "*/ELV"

    pressureMetaData:
      query: "*/P___INFO/P__EVENT{1}/POB"
      transforms:
        - scale: 100

    satelliteId:
      query: "*/SAID"

    qualityFlags:
      query: "*/WVCQ"

    # ObsType
    observationType:
      query: "*/TYP"

    observationSubType:
      query: "*/T29"
     
    # ObsValue 
    windEastwardObsValue:
      query: "*/W___INFO/W__EVENT{1}/UOB"

    windNorthwardObsValue:
      query: "*/W___INFO/W__EVENT{1}/VOB"

    # QualityMarker
    windEastwardQualityMarker:
      query: "*/W___INFO/W__EVENT{1}/WQM"

    windNorthwardQualityMarker:
      query: "*/W___INFO/W__EVENT{1}/WQM"

    # ObsError
    windEastwardObsError:
      query: "*/W___INFO/W__BACKG/WOE"

    windNorthwardObsError:
      query: "*/W___INFO/W__BACKG/WOE"

encoder:
  globals:
    - name: "description"
      type: string
      value: "ASCAT wind"

    - name: "platformCommonName"
      type: string
      value: "MetOp"

    - name: "platformLongDescription"
      type: string
      value: "Meteorological Operational Satellite"

    - name: "sensorCommonName"
      type: string
      value: "ASCAT"

    - name: "sensorLongDescription"
      type: string
      value: "Advanced Scatterometer"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centres for Environmental Prediction (NCEP))"

    - name: "sourceFiles"
      type: string
      value: "NCEP prepBUFR - ASCATW"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData 
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "dateTime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [ -90, 90 ]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [ -180, 180 ]

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    - name: "MetaData/pressure"
      source: variables/pressureMetaData
      longName: "Pressure"
      units: "Pa"
    
    - name: "MetaData/height"
      source: variables/height
      longName: "Height"
      units: "m"

    - name: "MetaData/observationSubType"
      source: variables/observationSubType
      longName: "Observation SubType Number"

    # ObsType
    - name: "ObsType/windEastward"
      source: variables/observationType
      longName: "windEastward ObsType"

    - name: "ObsType/windNorthward"
      source: variables/observationType
      longName: "windNorthward ObsType"

    #ObsValue
    - name: "ObsValue/windEastward"
      source: variables/windEastwardObsValue
      longName: "Eastward Wind"
      units: "m s-1"

    - name: "ObsValue/windNorthward"
      source: variables/windNorthwardObsValue
      longName: "Northward Wind"
      units: "m s-1"

    # QualityMarker
    - name: "QualityMarker/windNorthward"
      source: variables/windNorthwardQualityMarker
      longName: "U, V-Component of Wind Quality Marker"

    - name: "QualityMarker/windEastward"
      source: variables/windEastwardQualityMarker
      longName: "U, V-Component of Wind Quality Marker"

    # ObsError
    - name: "ObsError/windEastward"
      source: variables/windEastwardObsError
      longName: "Eastward Wind Error"
      units: "m s-1"

    - name: "ObsError/windNorthward"
      source: variables/windNorthwardObsError
      longName: "Northward Wind Error"
      units: "m s-1"
