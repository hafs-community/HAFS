bufr:
  subsets:
    - NC006070
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"
    # Fake time offset variable
    timeOffset:
      query: "*/FLVLST"

    stationIdentification:
      query: "*/PTID"

    latitude:
      query: "[*/CLATH, */CLAT]"

    longitude:
      query: "[*/CLONH, */CLON]"

    stationElevation:
      query: "*/FLVLST"
      reference: -1024.

    # ObsValue
    beamAzimuthAngle:
      query: "*/ANAZ"
      type: float
    beamTiltAngle:
      query: "*/ANEL"
      type: float
    gateRange:
      query: "*/NP3RW{1}/DIST"
      type: float
    radialVelocity:
      query: "*/NP3RW{1}/DMVR"
    spectralWidth:
      query: "*/NP3RW{1}/DVSW"
    #unfoldingVelocity:
      #query: "*/HNQV"


encoder:
  type: netcdf

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    # create a fake timeoffset
    - name: "MetaData/timeOffset"
      source: variables/timeOffset
      longName: "Observation Time Minus Reference Time"
      units: "s"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Station Identification"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station Ground Above MSL"
      units: "m"

    - name: "MetaData/radar_azimuth"
      source: variables/beamAzimuthAngle
      longName: "Antenna Azimuth Angle"
      units: "degree"
    - name: "MetaData/radar_tilt"
      source: variables/beamTiltAngle
      longName: "Antenna Elevation Angle"
      units: "degree"
    - name: "MetaData/gateRange"
      source: variables/gateRange
      longName: "Distance From Antenna"
      units: "m"

    # ObsValue
    - name: "ObsValue/radialVelocity"
      source: variables/radialVelocity
      longName: "Doppler Mean Radial Velocity"
      units: "m s-1"


