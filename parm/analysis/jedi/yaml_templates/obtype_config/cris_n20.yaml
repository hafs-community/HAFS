    - obs space:
        name: CRIS-FSR N20
        obsdatain:
          engine:
            type: H5File
            obsfile: obs/hafs.#HH#.cris_n20.nc
        obsdataout:
          engine:
            type: H5File
            obsfile: hofx/hofx.cris_n20_#HH#.nc
        io pool:
          max pool size: 1
        simulated variables: [brightness_temperature]
        channels: &cris_n20_channels 1-430
    
      # Observation Operator
      # --------------------
      obs operator:
        name: CRTM
        Absorbers: [H2O, O3]
        Clouds: [Water, Ice]
        Cloud_Fraction: 1.0
        obs options:
          Sensor_ID: cris-fsr_n20
          EndianType: little_endian
          CoefficientPath: crtm/
    
      # Observation Bias Correction (VarBC)
      # -----------------------------------
      obs bias:
        input file: obs/satbias_cris_n20_#HH#.nc
        output file: bc/out_satbias_cris_n20_#HH#.nc
        variational bc:
          predictors:
          - name: constant
          - name: lapseRate
            order: 2
            tlapse: &cris_n20_tlapse obs/cris_n20.tlapse.txt
          - name: lapseRate
            tlapse: *cris_n20_tlapse
          - name: emissivityJacobian
          - name: sensorScanAngle
            order: 4
          - name: sensorScanAngle
            order: 3
          - name: sensorScanAngle
            order: 2
          - name: sensorScanAngle
        covariance:
          minimal required obs number: 20
          variance range: [1.0e-6, 10.0]
          step size: 1.0e-4
          largest analysis variance: 10000.0
          prior:
            input file: obs/satbias_cris_n20_#HH#_cov.nc
            inflation:
              ratio: 1.1
              ratio for small dataset: 2.0
          output file: bc/out_satbias_cris_n20_#HH#_cov.nc

      obs pre filters:
      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/latitude
            minvalue: #MIN_LAT#
            maxvalue: #MAX_LAT#
        action:
           name: reduce obs space

      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/longitude
            minvalue: #MIN_LON#
            maxvalue: #MAX_LON#
        action:
           name: reduce obs space

      obs post filters:
      - filter: Bounds Check
        filter variables:
        - name: brightnessTemperature
          channels: *atms_n20_channels
        test variables:
        - name: GeoVaLs/observable_domain_mask
          flag all filter variables if any test variable is out of bounds: true
          minvalue: 0.0
          maxvalue: 0.5
