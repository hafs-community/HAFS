    - obs space:
        name: drpsnd_specificHumidity_137
        obsdatain:
          engine:
            type: H5File
            obsfile: obs/hafs.#HH#.drpsnd.nc
            missing file action: "warn"
        obsdataout:
          engine:
            type: H5File
            obsfile: hofx/diag_drpsnd_specificHumidity_137_#HH#.nc
            allow overwrite: true
        io pool:
          max pool size: #TOTAL_TASKS#
        observed variables: [specificHumidity]
        simulated variables: [specificHumidity]

      obs operator:
        name: Composite
        components:
        - name: VertInterp
          vertical coordinate: air_pressure
          observation vertical coordinate: pressure
          observation vertical coordinate group: MetaData
          interpolation method: log-linear
          variables: 
          - name: [specificHumidity]

      obs error:
        covariance model: diagonal

      obs pre filters:          
      - filter: Domain Check
        apply at iterations: 0,1
        where:
        - variable:
            name: MetaData/latitude
          minvalue: #MIN_LAT# 
          maxvalue: #MAX_LAT#
        action:
          name: reduce obs space

      - filter: Domain Check
        apply at iterations: 0,1
        where:
        - variable:
            name: MetaData/longitude
          minvalue: #MIN_LON#
          maxvalue: #MAX_LON#
        action:
          name: reduce obs space

      # Reject all obs with QualityMarker > 3
      - filter: RejectList
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        where:
        - variable: ObsType/specificHumidity
          is_not_in: 137
        - variable: QualityMarker/specificHumidity
          is_in: 4-15
          value: is_not_valid
        - variable: MetaData/pressure
          value: is_not_valid
        where operator: or
        action: 
          name: reduce obs space

      # Time window filter
      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/timeOffset # units: s
            minvalue: -10800
            maxvalue:  10800
        action:
          name: reduce obs space

      obs prior filters:  
      # Regional Domain Check
      - filter: Bounds Check
        filter variables:
        - name: specificHumidity
        test variables:
        - name: GeoVaLs/observable_domain_mask
          minvalue: 0.0
          maxvalue: 0.5
        
      # Initial errror assignment
      - filter: Perform Action
        filter variables:
        - name: specificHumidity
        where:
        - variable: ObsType/specificHumidity
          is_in: 137
        action:
          name: assign error
          error parameter: 0.07

      ## error inflation if observation QM is 3 or 7 
      - filter: Perform Action
        filter variables:
        - name: specificHumidity
        where:
        - variable: 
            name: QualityMarker/specificHumidity
          is_in: 3,7        
        action:
          name: inflate error
          inflation factor: 1.2


      # Observation Post Filters (QC)
      # -------------------------------
      obs post filters:
      ## dynamic observation error (DOE)
      - filter: Variable Assignment
        assignments:
        - name: OmB/specificHumidity
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables: [ObsValue/specificHumidity, HofX/specificHumidity]
              coefs: [1.0, -1.0]

      - filter: Perform Action
        filter variables:
        - name: specificHumidity
        action:
          name: assign error
          error function:
            name: ObsFunction/Arithmetic
            options:
              variables: [OmB/specificHumidity]
              absolute value: [true]
              total coefficient: 0.75
              intercept: 0.0003

      ##  error inflation based on pressure check (setupq.f90)
      - filter: Perform Action
        filter variables:
        - name: specificHumidity
        where:
        - variable: ObsType/specificHumidity
          is_in: 137
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorPressureCheck
            options:
              variable: specificHumidity
              inflation factor: 8.0
              request_saturation_specific_humidity_geovals: true

      # Create temporary ObsErrorData
      - filter: Variable Assignment
        apply at iterations: 0,1
        assignments:
        - name: TempObsErrorData/specificHumidity
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/specificHumidity
      # Set ObsError set "error parameter" if < "max value"
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        action:
          name: assign error
          error parameter: 10.0
        where:
        - variable:
            name: ObsErrorData/specificHumidity
          maxvalue: 10.0
        - variable:
            name: ObsErrorData/specificHumidity
          value: is_valid

      # Set ObsError set "error parameter" if > "min value"
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        action:
          name: assign error
          error parameter: 100.0
        where:
        - variable:
            name: ObsErrorData/specificHumidity
          minvalue: 100.0
        - variable:
            name: ObsErrorData/specificHumidity
          value: is_valid

      # Gross Error Check
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        threshold: 8.0
        where:
        - variable: QualityMarker/specificHumidity
          is_not_in: 3
        action:
          name: reject

      # Gross Error Check
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        threshold: 5.6
        where:
        - variable: QualityMarker/specificHumidity
          is_in: 3
        action:
          name: reject

      # Re-assign err ObsErrorData <--- TempObsErrorData after gross error check.
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: specificHumidity
        action:
          name: assign error
          error function: TempObsErrorData/specificHumidity
        where:
        - variable:
            name: TempObsErrorData/specificHumidity
          value: is_valid
