    - obs space:
        name: aircar_winds_233
        obsdatain:
          engine:
            type: H5File
            obsfile: obs/hafs.#HH#.aircar.nc
            missing file action: "warn"
          obsgrouping:
            group variables: ["stationIdentification"]
            sort variable: "pressure"
            sort order: "descending"
        obsdataout:
          engine:
            type: H5File
            obsfile:  hofx/diag_aircar_winds_233_#HH#.nc
            allow overwrite: true
        io pool:
          max pool size: #TOTAL_TASKS#
        observed variables: [windEastward, windNorthward]
        simulated variables: [windEastward, windNorthward]
      obs operator:
        name: VertInterp
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
        variables:
        - name: windEastward
        - name: windNorthward

      linear obs operator:
        name: VertInterp

      obs error:
        covariance model: diagonal

      obs pre filters:
      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/latitude
            minvalue: #MIN_LAT#
            maxvalue: #MAX_LAT#
        action:
           name: reduce obs space

      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/longitude
            minvalue: #MIN_LON#
            maxvalue: #MAX_LON#
        action:
           name: reduce obs space

      # Reject all obs with QualityMarker > 3
      - filter: RejectList
        apply at iterations: 0,1
        filter variables:
        - name: windEastward
        - name: windNorthward
        where:
        - variable: ObsType/windEastward
          is_not_in: 233
        - variable: QualityMarker/windEastward
          is_in: 4-15
          value: is_not_valid
        - variable: MetaData/pressure
          value: is_not_valid
        where operator: or
        action:
          name: reduce obs space

      obs post filters:
      # Regional Domain Check
      - filter: Bounds Check
        filter variables:
        - name: windEastward
        - name: windNorthward
        test variables:
        - name: GeoVaLs/observable_domain_mask
          minvalue: 0.0
          maxvalue: 0.5
      # Reject all obs with QualityMarker > 3
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: windEastward
        - name: windNorthward
        where:
        - variable: QualityMarker/windEastward
          is_in: 4-15
          value: is_not_valid
        where operator: or
        action:
          name: reject
#        action:
#          name: reduce obs space

      - filter: Domain Check
        apply at iterations: 0,1
        where:
          - variable:
              name: MetaData/timeOffset
            minvalue: -10800.0
            maxvalue: 10800.0

      # ----------------------------------
      # windEastward
      # ----------------------------------
      # Initial error assignment
      - filter: Perform Action
        filter variables:
        - name: windEastward
        - name: windNorthward
        where:
        - variable: ObsType/windEastward
          is_in: 233
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals: [110000, 105000, 100000, 95000, 90000, 85000, 80000, 75000, 70000, 65000, 60000, 55000, 50000, 45000, 40000, 35000, 30000, 25000, 20000, 15000, 10000, 7500, 5000, 4000, 3000, 2000, 1000, 500, 400, 300, 200, 100, 0]
              errors: [2.3039, 2.3172, 2.3859, 2.5156, 2.6722, 2.7919, 2.8353, 2.803, 2.7272, 2.6731, 2.6458, 2.6225, 2.6219, 2.6936, 2.8748, 3.1458, 3.4075, 3.5051, 3.3091, 2.9037, 2.573, 2.4007, 2.3377, 2.3223, 2.3208, 2.3213, 2.3215, 2.3215, 2.3214, 2.3213, 2.3212, 2.3215, 2.3221]
      # Error inflation based on pressure check (setup2.f90)
      # WindEastward
      - filter: Perform Action
        filter variables:
        - name: windEastward
        where:
        - variable: ObsType/windEastward
          is_in: 233
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorPressureCheck
            options:
              variable: windEastward
              inflation factor: 4.0
      # windNorthward
      - filter: Perform Action
        filter variables:
        - name: windNorthward
        where:
        - variable: ObsType/windNorthward
          is_in: 233
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorPressureCheck
            options:
              variable: windNorthward
              inflation factor: 4.0
      # # Error inflation based on errormod (qcmod.f90)
      # # WindEastward
      # - filter: Perform Action
      #   filter variables:
      #   - name: windEastward
      #   where:
      #   - variable: ObsType/windEastward
      #     is_in: 233
      #   action:
      #     name: inflate error
      #     inflation variable:
      #       name: ObsFunction/ObsErrorFactorConventional
      #       options:
      #         inflate variables: [windEastward]
      #         pressure: MetaData/pressure
      # # WindNorthward
      # - filter: Perform Action
      #   filter variables:
      #   - name: windNorthward
      #   where:
      #   - variable: ObsType/windNorthward
      #     is_in: 233
      #   action:
      #     name: inflate error
      #     inflation variable:
      #       name: ObsFunction/ObsErrorFactorConventional
      #       options:
      #         inflate variables: [windNorthward]
      #         pressure: MetaData/pressure
      # Error inflation when QualityMarker == 3 (read_prepbufr.f90)
      - filter: Perform Action
        filter variables:
        - name: windEastward
        - name: windNorthward
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: QualityMarker/windEastward
          is_in: 3
      # Error inflation when observation pressure < 50 hPa (read_prepbufr.f90)
      - filter: Perform Action
        filter variables:
        - name: windEastward
        - name: windNorthward
        action:
          name: inflate error
          inflation factor: 1.2
        where:
        - variable: MetaData/pressure
          maxvalue: 5000.0

      # Bounds Check (ObsError)
#      - filter: Bounds Check
#        filter variables:
#        - name: windEastward
#        - name: windNorthward
#        test variables:
#        - name: ObsErrorData/windEastward
#        minvalue: 0.0
#        action:
#          name: reduce obs space

      # Bounds check (ObsValue)
      - filter: Bounds Check
        apply at iterations: 0,1
        filter variables:
        - name: windEastward
        - name: windNorthward
        minvalue: -200.
        maxvalue: 200.
        action:
          name: reject
#        action:
#          name: reduce obs space
      # Gross Error Check (windEastward)
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: windEastward
        function absolute threshold:
        - name: ObsFunction/WindsSPDBCheck
          options:
            wndtype:    [ 233 ]
            cgross:     [ 7.5 ]
            error_min:  [ 1.4 ]
            error_max:  [ 6.1 ]
            variable: windEastward
        where:
        - variable: QualityMarker/windEastward
          is_not_in: 3
        action:
          name: reject
        defer to post: true

      # Gross Error Check (windNorthward)
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: windNorthward
        function absolute threshold:
        - name: ObsFunction/WindsSPDBCheck
          options:
            wndtype:    [ 233 ]
            cgross:     [ 7.5 ]
            error_min:  [ 1.4 ]
            error_max:  [ 6.1 ]
            variable: windNorthward
        where:
        - variable: QualityMarker/windNorthward
          is_not_in: 3
        action:
          name: reject
        defer to post: true
      # Gross Error Check (windEastward): cgross*0.7 if QualityMarker=3
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: windEastward
        function absolute threshold:
        - name: ObsFunction/WindsSPDBCheck
          options:
            wndtype:    [ 233 ]
            cgross:     [ 5.25 ]
            error_min:  [ 1.4 ]
            error_max:  [ 6.1 ]
            variable: windEastward
        where:
        - variable: QualityMarker/windEastward
          is_in: 3
        action:
          name: reject
        defer to post: true

      # Gross Error Check (windNorthward): cgross*0.7 if QualityMarker=3
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: windNorthward
        function absolute threshold:
        - name: ObsFunction/WindsSPDBCheck
          options:
            wndtype:    [ 233 ]
            cgross:     [ 5.25 ]
            error_min:  [ 1.4 ]
            error_max:  [ 6.1 ]
            variable: windNorthward
        where:
        - variable: QualityMarker/windNorthward
          is_in: 3
        action:
          name: reject
        defer to post: true
