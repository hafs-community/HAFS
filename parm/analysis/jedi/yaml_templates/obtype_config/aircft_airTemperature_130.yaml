    - obs space:
        name: aircft_airTemperature_130
        obsdatain:
          engine:
            type: H5File
            obsfile: obs/hafs.#HH#.aircft.nc
            missing file action: "warn"
        obsdataout:
          engine:
            type: H5File
            obsfile: hofx/diag_aircft_airTemperature_130_#HH#.nc
            allow overwrite: true
        io pool:
          max pool size: #TOTAL_TASKS#
        observed variables: [airTemperature]
        simulated variables: [airTemperature]
      obs operator:
        name: Composite
        components:
        - name: VertInterp
          vertical coordinate: air_pressure
          observation vertical coordinate: pressure
          observation vertical coordinate group: MetaData
          interpolation method: log-linear
          variables:
          - name: airTemperature

      obs error:
        covariance model: diagonal

      obs localizations:
      - localization method: Horizontal Gasperi-Cohn
        lengthscale: 300e3

      obs filters:
      # Regional Domain Check
      - filter: Bounds Check
        filter variables:
        - name: airTemperature
        test variables:
        - name: GeoVaLs/observable_domain_mask
          minvalue: 0.0
          maxvalue: 0.5
      # Reject all obs with QualityMarker > 3
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_not_in: 130
        - variable: QualityMarker/airTemperature
          is_in: 4-15
          value: is_not_valid
        - variable: MetaData/pressure
          value: is_not_valid
        where operator: or
        action:
          name: reject
          name: reduce obs space

      # Time window filter
      - filter: Domain Check
        apply at iterations: 0,1
        where:
        - variable:
            name: MetaData/timeOffset # units: s
          minvalue: -10800
          maxvalue:  10800
        #action:
        #name: recude obs space

      # Initial errror assignment
      - filter: Perform Action
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in: 130
        action:
          name: assign error
          error function:
            name: ObsFunction/ObsErrorModelStepwiseLinear
            options:
              xvar:
                name: MetaData/pressure
              xvals: [110000, 105000, 100000, 95000, 90000, 85000, 80000, 75000, 70000, 65000, 60000, 55000, 50000, 45000, 40000, 35000, 30000, 25000, 20000, 15000, 10000, 7500, 5000, 4000, 3000, 2000, 1000, 500, 400, 300, 200, 100, 0]
              errors: [2.4308, 2.3855, 2.3123, 2.2137, 2.0999, 1.9857, 1.8857, 1.8094, 1.7590, 1.7307, 1.7174, 1.7098, 1.6958, 1.6611, 1.5936, 1.4949, 1.3923, 1.3291, 1.3180, 1.3443, 1.4054, 1.4870, 1.5663, 1.6273, 1.6658, 1.6862, 1.6954, 1.6988, 1.6997, 1.6997, 1.6993, 1.6985, 1.6977]

      ##  error inflation based on pressure check (setupt.f90)
      - filter: Perform Action
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in: 130
        action:
          name: inflate error
          inflation variable:
            name: ObsFunction/ObsErrorFactorPressureCheck
            options:
              variable: airTemperature
              inflation factor: 8.0

      # Bounds Check
      - filter: Bounds Check
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        minvalue: 100
        maxvalue: 400

      # Create temporary ObsErrorData
      - filter: Variable Assignment
        apply at iterations: 0,1
        assignments:
        - name: TempObsErrorData/airTemperature
          type: float
          function:
            name: ObsFunction/Arithmetic
            options:
              variables:
              - name: ObsErrorData/airTemperature
        defer to post: true
      # Set ObsError set "error parameter" if < "max value"
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error parameter: 1.3
        where:
        - variable:
            name: ObsErrorData/airTemperature
          maxvalue: 1.3
        - variable:
            name: ObsErrorData/airTemperature
          value: is_valid
        defer to post: true
      # Set ObsError set "error parameter" if > "min value"
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error parameter: 5.6
        where:
        - variable:
            name: ObsErrorData/airTemperature
          minvalue: 5.6
        - variable:
            name: ObsErrorData/airTemperature
          value: is_valid
        defer to post: true

      # Gross Error Check
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        threshold: 7.0
        action:
          name: reject
        where:
        - variable: ObsType/airTemperature
        - variable: QualityMarker/airTemperature
          is_not_in: 3
        defer to post: true
      # Gross Error Check: cgross*0.7 if QualityMarker=3
      - filter: Background Check
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        threshold: 5.6
        action:
          name: reject
        where:
        - variable: ObsType/airTemperature
        - variable: QualityMarker/airTemperature
          is_in: 3
        defer to post: true

      # Re-assign err ObsErrorData <--- TempObsErrorData after gross error check.
      - filter: Perform Action
        apply at iterations: 0,1
        filter variables:
        - name: airTemperature
        action:
          name: assign error
          error function: TempObsErrorData/airTemperature
        where:
        - variable:
            name: TempObsErrorData/airTemperature
          value: is_valid
        defer to post: true

      # Duplicate Check
      - filter: Temporal Thinning
        apply at iterations: 0,1
        min_spacing: PT00M
        seed_time: _ANALYSISDATE_
        category_variable:
          name: MetaData/stationIdentification
