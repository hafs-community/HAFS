[config]
RUN=hfsa
run_wave=no
run_ocean=no
run_atm_init_ens=no
run_atm_init_fgat_ens=yes
run_atm_vi_fgat=yes
ENS_SIZE=80
analysis_d01=no
analysis_d02=yes
analysis_model=JEDI
run_ensda=no
GRID_RATIO_ENS=3

[gsi]
use_bufr_nr=yes            ;; use non-restricted version of observational bufr files

[jedi]
l4denvar=.true.
loc_h=536                ;; horizontal localization scale in km
loc_v=1.65               ;; vertical localization scale in sigma
layoutx_jedi=20
layouty_jedi=10

[forecast]
all_tasks=1080
atm_tasks=1020
ocn_tasks=60
wav_tasks=60
layoutx=30,21
layouty=20,20

write_groups=3
write_tasks_per_group=20

[grid_ens]
CASE=C512
nest_grids_ens=1
refine_ratio_ens=3
istart_nest_ens=263
jstart_nest_ens=263
iend_nest_ens=762
jend_nest_ens=762
idim_nest_ens=750
jdim_nest_ens=750
delx_nest_ens=0.03
dely_nest_ens=0.03
gridfixdir_ens=/let/hafs_grid/generate/grid_ens

[forecast_ens]
is_moving_nest_ens=.false.,.false.
restart_interval_ens="3 6 9"
all_tasks_ens=300
atm_tasks_ens=300
layoutx_ens=12
layouty_ens=20

npx_ens=751
npy_ens=751
FORECAST_ENS_RESOURCES=FORECAST_RESOURCES_300PE

[rocotostr]
FORECAST_ENS_RESOURCES=FORECAST_RESOURCES_660PE
