## The default configuration (all options enabled) will be the AL
## configuration. However, this file MUST exist otherwise the
## parm/hfsb_other_basins.conf will be used.

[config]
run_wave=no

run_atm_init=yes
run_atm_init_fgat=no
run_atm_vi=yes
run_atm_vi_fgat=no
run_gsi=no
run_fgat=no
run_envar=no
gsi_d01=no
gsi_d02=no
run_analysis_merge=yes

[atm_init]
# ccpp suites
ccpp_suite_regional_init=FV3_HAFS_v2_gfdlmp
ccpp_suite_glob_init=FV3_HAFS_v2_gfdlmp
ccpp_suite_nest_init=FV3_HAFS_v2_gfdlmp

[vi]
vi_cloud=1

[forecast]
iau_regional=.false.

# ccpp suites
ccpp_suite_regional=FV3_HAFS_v2_gfdlmp_coupled
ccpp_suite_glob=FV3_HAFS_v2_gfdlmp_coupled
ccpp_suite_nest=FV3_HAFS_v2_gfdlmp_coupled

# GFDL MP related options
imp_physics=11
dnats=1
do_sat_adj=.true.
lgfdlmprad=.true.
