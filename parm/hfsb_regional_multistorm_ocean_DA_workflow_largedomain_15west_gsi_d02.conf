[config]
RUN=hfsb_multistorm
parent_domain_center=storm
#domlat=30.0
#domlon=-80.0
#domlat=20.0
#domlon=-55.0
#LJG 2024-08-01
domlat=20.0
domlon=-70.0                              

run_multistorm=yes
run_atm_mvnest=yes
run_wave=no
ww3_model=ww3
run_ocean=yes
ocean_model=hycom

# Lew.Gramer@noaa.gov 2024-01-17
run_atm_mvnest_ens=no
run_atm_init=yes
run_atm_init_fgat=yes
run_atm_init_ens=no
# LJG 2024-08-04 per Andy
run_atm_merge=no
run_atm_merge_fgat=no
run_atm_merge_ens=no
run_atm_vi=yes
run_atm_vi_fgat=yes
run_atm_vi_ens=no
run_gsi=yes
gsi_d01=no
# LJG: 2024-08-03 and again 2024-08-07
gsi_d02=yes
# LJG: 2024-08-04
#gsi_d02=no
gsi_d03=no
run_analysis_merge=yes
run_analysis_merge_ens=no
run_fgat=yes
run_envar=yes
run_ensda=no
run_enkf=no
run_wave=no
# LJG

# Lew.Gramer@noaa.gov 2024-01-24
out_gridnames=parent,storm2,storm3,storm4,storm5,storm6,storm7,storm8,storm9
# LJG

halo_blend=20

[hycominit1]
hycom_domain=large

[dir]
PARMforecast={PARMhafs}/forecast/regional

[grid]
CASE=C512            ;; FV3 resolution
LEVS=82              ;; Model vertical levels
gtype=regional       ;; grid type: uniform, stretch, nest, or regional
gridfixdir=/let/hafs_grid/generate/grid
stretch_fac=1.0001   ;; Stretching factor for the grid
target_lon={domlon}  ;; center longitude of the highest resolution tile
target_lat={domlat}  ;; center latitude of the highest resolution tile
# Lew.Gramer@noaa.gov 2023-12-13
#nest_grids=4
# Lew.Gramer@noaa.gov 2024-04-08
nest_grids=6
parent_grid_num=1,2,2,2,2,2,2,2,2,2
parent_tile=6,7,7,7,7,7,7,7,7,7
refine_ratio=3,3,3,3,3,3,3,3,3,3
# 20200912 00Z  Sally 26N 80W, Teddy 12N 44W
#istart_nest=113,1401,361
#jstart_nest=113,801,1221
#iend_nest=912,1800,760
#jend_nest=912,1200,1620

# 20200914 00Z  Paulette 33N 65W  Sally 28N 87W, Teddy 12.9N 38.7W
#istart_nest=113,1001,1601,201
#jstart_nest=113,601,701,1321
#iend_nest=912,1400,2000,600
#jend_nest=912,1000,1100,1720

istart_nest=73,-999,-999,-999,-999,-999,-999,-999,-999,-999
jstart_nest=419,-999,-999,-999,-999,-999,-999,-999,-999,-999
iend_nest=1464,-999,-999,-999,-999,-999,-999,-999,-999,-999
jend_nest=1118,-999,-999,-999,-999,-999,-999,-999,-999,-999
regional_esg=yes
idim_nest=2088,600,600,600,600,600,600,600,600,600
jdim_nest=1050,600,600,600,600,600,600,600,600,600
delx_nest=0.03,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01
dely_nest=0.03,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.01
halop2=5
pazi=-180.


[grid_mvnest1res]
CASE_mvnest1res=C512
LEVS_mvnest1res={grid/LEVS}
gtype_mvnest1res={grid/gtype}
#gridfixdir_mvnest1res=/let/hafs_grid/generate/grid_mvnest1res
#gridfixdir_mvnest1res=/lfs5/HFIP/hur-aoml/rthr-aoml/fix/grid_mvnest1res/HAFSV2.0.1M_2024_RT/hfsb_regional_multistorm_ocean_DA_workflow_largedomain_15west_gsi_d02
#gridfixdir_mvnest1res=/scratch2/AOML/aoml-hafs1/role.aoml-hafs1/fix/grid_mvnest1res/HAFSV2.0.1M_RT/hfsb_regional_multistorm_ocean_DA_workflow_largedomain_15west
#gridfixdir_mvnest1res=/scratch2/AOML/aoml-hafs1/role.aoml-hafs1/fix/grid_mvnest1res/HAFSV2.0.1M_RT/hfsb_regional_multistorm_ocean_DA_workflow_largedomain_15west_gsi_d02
#gridfixdir_mvnest1res=/work2/noaa/aoml-hafs1/lgramer/fix/grid_mvnest1res/hfsb_regional_multistorm_ocean_DA_workflow_largedomain_15west_gsi_d02
gridfixdir_mvnest1res={CDSCRUB}/{SUBEXPT}/grid_mvnest1res
stretch_fac_mvnest1res={grid/stretch_fac}
target_lon_mvnest1res={grid/target_lon}
target_lat_mvnest1res={grid/target_lat}
