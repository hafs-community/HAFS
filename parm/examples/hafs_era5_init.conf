# This is a UNIX conf file to be used on top of a HAFS configuration (e.g.,
# hfsa.conf or hfsb.conf) to cold start the atmosphere from ERA5 reanalysis
# instead of GFS, for cases without GFS/GDAS data in the current format.
#
# The ERA5 data need to be prepared in advance as pseudo-GFS GRIB2 files:
#   ush/hafs_era5_ic_download.py -o ${ERA5dir} YYYYMMDD-YYYYMMDD
#   ush/hafs_era5_to_gfsgrib2.py --pl ${ERA5dir}/ERA5_pl_*.nc \
#       --sfc ${ERA5dir}/ERA5_sfc_*.nc --cycle YYYYMMDDHH \
#       --fhrs 0:${NHRS}:${NBDYHRS} --gfsver ${GFSVER} --outdir ${COMera5}
# where --gfsver needs to match the GFSVER of the configuration (PROD2026 by
# default), which sets the directory layout and file names HAFS looks for.
#
# This configuration is the first step of the HAFS reanalysis development:
# no data assimilation, and no ocean and wave coupling yet, since the GDAS,
# RTOFS and GFS-wave inputs are not available for these cases either.

[config]
ictype=gfsgrib2_0p25 ;; pseudo-GFS GRIB2 files from hafs_era5_to_gfsgrib2.py
bctype=gfsgrib2_0p25
NBDYHRS=3            ;; Needs to be a multiple of the ERA5 --hour-step
gfs_datadep=no       ;; Do not make atm_ic and atm_lbc wait for the GFS files

run_atm_init_fgat=no ;; FGAT uses GDAS forecasts
run_atm_vi_fgat=no
run_analysis=no      ;; DA needs GDAS ensembles, satbias and observation dumps
run_analysis_merge=no
run_fgat=no
run_envar=no
run_ensda=no
run_enkf=no
run_ocean=no         ;; Ocean coupling needs RTOFS and GFS surface fluxes
run_wave=no          ;; Wave coupling needs gfswave/gdaswave

[dir]
# Root directory of the pseudo-GFS files (the --outdir above). The other
# input directories, including the TC vitals, stay where the system.conf
# file of the platform puts them.
COMera5=/please/set/the/pseudo-GFS/directory
COMINgfs={COMera5}
COMINmsg={COMgfs}
COMINhafs={COMgfs}

[atm_init]
# ERA5 has no NSST fields: use nstf_name=2,1,0,0,0 as for grib2 type ictype
nstf_n1_init=2
nstf_n2_init=1
nstf_n3_init=0
nstf_n4_init=0
nstf_n5_init=0

[forecast]
nstf_n1=2
nstf_n2=1
nstf_n3=0
nstf_n4=0
nstf_n5=0
