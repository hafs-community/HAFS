npy=1321,661
npz=81
k_split=2,4
n_split=6,9
layoutx=30,18
layouty=20,20
io_layoutx=1,1
io_layouty=1,1
hord_mt=1,1
hord_vt=1,1
hord_tm=1,1
hord_dp=1,1
hord_tr=-5,-5
lim_fac=3.0,3.0
full_zs_filter=.true.,.true.
n_zs_filter=1,1
n_del2_weak=15,24
max_slope=0.12,0.12
rlmx=-0.055,-0.035
elmx=-0.25,-0.25
sfc_rlm=1,1
tc_pbl=0,0
shal_cnv=.true.,.true.
do_deep=.true.,.true.
use_lpt=1
fs_fac_rain=1.25
fs_fac_snow=1.25
sa3dtke_dyco=.true.
sa3dtke=.true.
tte_edmf=.false.
#radiation scheme calling time steps
fhswr=1800.
